name: stock-watch

on:
  # cron은 UTC 기준(KST-9). 매시 7분에 도는 건 정각에 GitHub가 붐벼 지연이 크기 때문
  schedule:
    - cron: "7 23 * * 0-4"           # 평일 KST 08시
    - cron: "7 0-9 * * 1-5"          # 평일 KST 09~18시 매시간 (장중·장 마감 공시)
    - cron: "7 12,15,18,21 * * *"    # 매일 KST 21·00·03·06시 (밤엔 3시간마다, 비트코인·뉴스용)
    - cron: "7 0,3,6,9 * * 0,6"      # 주말 KST 09·12·15·18시
  workflow_dispatch:       # Actions 화면에서 수동 실행
    inputs:
      test:
        description: "테스트 알림 보내기 (기사·공시 링크 확인용)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stock-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 시세·뉴스·공시 확인
        env:
          TZ: Asia/Seoul
          PYTHONIOENCODING: utf-8
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_ALERT: ${{ inputs.test }}
        run: python cloud_watch.py
      - name: 상태 저장
        if: always()
        run: |
          git config user.name "stock-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A state
          git diff --cached --quiet || (git commit -m "state $(date -u +%FT%TZ)" && git push)
