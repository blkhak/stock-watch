name: stock-watch

on:
  schedule:
    - cron: "7 * * * *"   # 매시 7분(UTC 기준이지만 매시간이라 무관). 정각은 GitHub가 붐벼 지연이 큼
  workflow_dispatch:       # Actions 화면에서 수동 실행

permissions:
  contents: write

concurrency:
  group: stock-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 시세·뉴스 확인
        env:
          TZ: Asia/Seoul
          PYTHONIOENCODING: utf-8
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
        run: python cloud_watch.py
      - name: 상태 저장
        if: always()
        run: |
          git config user.name "stock-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "state $(date -u +%FT%TZ)" && git push)
